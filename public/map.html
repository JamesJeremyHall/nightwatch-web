<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nightwatch Software Division</title>
<meta name="description" content="Nightwatch Software Division — live dog-sighting map. Tap a location, log size, gender and color, and drop a pin where it was last seen. Sightings are shared with every visitor." />
<meta property="og:title" content="Nightwatch Software Division" />
<meta property="og:description" content="Nightwatch Software Division — live dog-sighting map. Tap a location, log size, gender and color, and drop a pin where it was last seen." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://nightwatchaviation.com/assets/logo.png?v=osm20261109" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#05070d; --panel:rgba(10,17,28,.92); --border:rgba(86,145,255,.16);
    --accent:#3b82f6; --accent2:#78abff; --text:#e9eff8; --dim:#93a4bd; --green:#3ddc84;
    --mono:"JetBrains Mono",ui-monospace,monospace; --body:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--body);background:var(--bg);color:var(--text);display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);position:relative}
  .back{background:none;border:0;padding:0;margin:0;cursor:pointer;display:flex;align-items:center;flex:none}
  .back:hover .logo{filter:brightness(1.35)}
  .logo{height:28px;width:auto;display:block;flex:none}
  header h1{min-width:0;margin:0;font-family:"Space Grotesk",var(--body);font-weight:600;font-size:clamp(11px,3.4vw,15px);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header h1#titleHome{cursor:pointer}
  header h1#titleHome:hover{color:var(--accent)}
  #map{flex:1;min-height:340px}
  .controls{position:fixed;z-index:1500;top:58px;right:14px;width:min(330px,calc(100vw - 28px));max-height:calc(100vh - 80px);overflow:auto;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(6px);display:none;box-shadow:0 18px 44px rgba(0,0,0,.55)}
  .controls.open{display:block}
  .controls h2{margin:0 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  .hint{margin:0 0 8px;font-size:11px;line-height:1.5;color:var(--dim)}
  .pins{list-style:none;margin:0;max-height:220px;overflow:auto;padding:0;font-size:12px}
  .pins li{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-top:1px solid var(--border);cursor:pointer}
  .dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:2px}
  .pinmeta{min-width:0;flex:1}
  .pinlabel{font-family:var(--mono);font-size:11px}
  .pinnote{font-size:11px;color:var(--dim);margin-top:2px;white-space:pre-wrap}
  .del{margin-left:auto;align-self:flex-start;background:none;border:0;color:var(--dim);cursor:pointer;font-size:15px;line-height:1}
  .btn{width:100%;margin-top:10px;padding:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);background:transparent;border:1px solid var(--border);border-radius:8px;cursor:pointer}
  .btn:hover{color:#fff;border-color:var(--accent)}
  .leaflet-container{background:#05070d}
  .nw-pin{border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.6)}
  .leaflet-tooltip{background:#0a111c;color:#e9eff8;border:1px solid var(--border);font-family:var(--mono);font-size:11px}
  .leaflet-popup-content-wrapper{background:#0a111c;color:var(--text);border:1px solid var(--border);border-radius:10px}
  .leaflet-popup-content{margin:14px;width:auto!important;line-height:1.4}
  .leaflet-popup-tip{background:#0a111c}
  .leaflet-container a.leaflet-popup-close-button{color:var(--dim)}
  .dogform{min-width:238px}
  .formrow{margin-bottom:11px}
  .formrow label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  .seggroup{display:flex;gap:5px}
  .seg{flex:1;padding:7px 4px;font-size:11px;font-family:var(--mono);color:var(--dim);background:transparent;border:1px solid var(--border);border-radius:7px;cursor:pointer}
  .seg.active{background:var(--accent);border-color:var(--accent);color:#04101f;font-weight:600}
  .swgroup{display:flex;gap:8px;flex-wrap:wrap}
  .swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.3)}
  .swatch.active{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
  .notes{width:100%;min-height:56px;resize:vertical;background:#05070d;color:var(--text);border:1px solid var(--border);border-radius:7px;padding:7px 8px;font-family:var(--body);font-size:12px}
  .notes:focus{outline:none;border-color:var(--accent)}
  .formbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:13px}
  .fb{padding:7px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:7px;cursor:pointer;border:1px solid var(--border)}
  .fb.cancel{background:transparent;color:var(--dim)}
  .fb.cancel:hover{color:#fff;border-color:var(--accent)}
  .fb.save{background:var(--accent);border-color:var(--accent);color:#04101f;font-weight:600}
  .fb.del{background:#3a1214;border-color:rgba(255,92,92,.45);color:#ff9d9d}
  .fb.del:hover{background:#4d1618;border-color:#ff5c5c;color:#ffb3b3}
  .delconfirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:13px;font-size:12px;color:var(--text)}
  .delconfirm[hidden]{display:none}
  .leaflet-tooltip .pinnotes{margin-top:5px;font-size:11px;line-height:1.4;white-space:pre-wrap;max-width:230px;color:#c9d4e5}
  .btn.locate{color:var(--accent2);margin-top:0;margin-bottom:10px}
  .btn.locate:hover{background:var(--accent);color:#04101f;border-color:var(--accent)}
  .search{display:flex;gap:6px;margin-bottom:10px}
  .search input{flex:1;min-width:0;background:#05070d;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 9px;font-family:var(--body);font-size:12px}
  .search input:focus{outline:none;border-color:var(--accent)}
  .search .btn{width:auto;flex:none;margin:0;padding:8px 13px}
  .search .btn:hover{background:var(--accent);color:#04101f}
  .status{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--dim)}
  .status.ok{color:var(--accent2)}
  .status.err{color:#e0a13b}
  .sightings{margin-left:auto;flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--green);white-space:nowrap}
  .sightings b{font-weight:700}
  .menuBtn{display:inline-flex;flex:none;width:38px;height:32px;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:17px;line-height:1;cursor:pointer}
  .menuBtn:hover{border-color:var(--accent);color:#fff}
  @media (max-width:760px){
    header{padding:8px 10px}
    header h1{font-size:11px;max-width:30vw}
    .sightings{font-size:10px;letter-spacing:.03em}
  }
</style>
</head>
<body>
  <header>
    <button class="back" id="backBtn" type="button" aria-label="Back to home" title="Back to home">
      <img class="logo" src="assets/logo.png" alt="Nightwatch Aviation" />
    </button>
    <h1 id="titleHome" title="Back to home">Nightwatch Software Division</h1>
    <div class="sightings" id="sightings">lost dog sightings: <b id="countNum">0</b></div>
    <button class="menuBtn" id="menuBtn" aria-label="Toggle map controls" aria-expanded="false">☰</button>
  </header>
  <div id="map"></div>
  <div class="controls">
    <div class="search">
      <input type="text" id="city" placeholder="Search a city…" autocomplete="off" />
      <button class="btn" id="searchBtn">Go</button>
    </div>
    <button class="btn locate" id="locate">◎ Use my location</button>
    <button class="btn" id="refresh" title="Refresh shared pins now">⟳ Refresh</button>
    <h2>Logged</h2>
    <p class="hint">Click the map to report a lost dog sighting. A pop-up asks for size, color, sex and notes. Scroll through and tap on the reported sightings below to zoom in on the location.</p>
    <ul class="pins" id="pins"></ul>
    <div class="status" id="status">Map: Bucyrus, OH (default)</div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  // Base maps: Esri World Street Map + Esri World Imagery (no key, no OSM rate-limit).
  // Default is context-based: satellite when embedded in the main page, street view full-screen.
  // NOTE: OpenStreetMap's public tiles were throttling/blanking this connection (returning
  //       1x1 empty tiles in bursts), so a no-key Esri basemap is used instead.
  //       If you have a self-hosted OSM tile set or a MapTiler/Stadia key, swap the URL above.
  const map = L.map('map').setView([40.808, -82.975], 15);   // Bucyrus, Crawford County, OH
  // --- Embedded mode: when iframed into the main page, skip geolocation and the
  // --- Bucyrus default; as soon as pins load, fit the view to all logged dogs.
  // --- Full-screen mode: same one-shot fit to all existing sightings; only if
  // --- there are no pins do we fall back to the user's location / Bucyrus.
  const embedded = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  // --- Logo + title act as back buttons (full-screen only; inert when iframed into the main page) ---
  if (!embedded){
    const goHome=()=>{ if (history.length > 1) history.back(); else window.location.href = 'index.html'; };
    document.getElementById('backBtn').addEventListener('click', goHome);
    document.getElementById('titleHome').addEventListener('click', goHome);
  }
  let fitted = false;
  function fitToDogs(){
    if (fitted) return;
    const pts = pins.filter(p => p.lat != null && p.lng != null).map(p => [p.lat, p.lng]);
    if (!pts.length) return;
    const b = L.latLngBounds(pts);
    if (!b.isValid()) return;
    map.fitBounds(b, { paddingTopLeft: L.point(30, 70), paddingBottomRight: L.point(30, 60), maxZoom: 16 });
    if (refMarker) { map.removeLayer(refMarker); refMarker = null; }
    fitted = true;
  }

  const baseDark = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Map data &copy; Esri, Maxar, Earthstar Geographics, the Community'
  });
  const baseSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Imagery © Esri, Maxar, Earthstar Geographics'
  });
  // Embedded in the main page → default to satellite; full-screen map → default to street view.
  const defaultBase = embedded ? baseSat : baseDark;
  defaultBase.addTo(map);

  // If the default tiles get blocked (403, etc.), switch to the other basemap automatically.
  let fellBack = false;
  defaultBase.on('tileerror', function () {
    if (fellBack) return;
    fellBack = true;
    const alt = embedded ? baseDark : baseSat;
    if (map.hasLayer(alt)) map.removeLayer(alt);
    map.removeLayer(defaultBase);
    alt.addTo(map);
    const s = document.getElementById('status');
    if (s) { s.textContent = (embedded ? 'Satellite tiles unavailable, switched to streets (Esri)' : 'Street tiles unavailable, switched to satellite (Esri)'); s.className = 'status err'; }
  });

  L.control.layers({ 'Satellite': baseSat, 'Streets': baseDark }, null, { position: 'bottomleft' }).addTo(map);
  let refMarker=L.marker([40.808, -82.975], {
    icon: L.divIcon({className:'', iconSize:[12,12], html:'<div style="width:12px;height:12px;border-radius:50%;background:#3b82f6;border:2px solid #fff;box-shadow:0 0 0 4px rgba(59,130,246,.3)"></div>'})
  }).addTo(map).bindTooltip('Bucyrus, OH', {permanent:true, direction:'top', offset:[0,-8]});

  // PLACEHOLDER, owner to confirm the real sizes & colors (see AGENTS.md §6).
  const SIZES = { "Small":14, "Medium":22, "Large":32 };
  const COLORS = [
    {name:"Black", hex:"#111318"}, {name:"Brown", hex:"#6b4423"},
    {name:"White", hex:"#e9ecef"}, {name:"Gray",  hex:"#8a94a3"},
    {name:"Tan",   hex:"#c9a06b"}, {name:"Red",   hex:"#c0392b"}
  ];

  // SHARED pins: the Node.js + SQLite server (server.js) is the source of truth.
  // This page no longer uses localStorage — every add/edit/delete goes to /api/pins,
  // and the list is (re)loaded from the server so all visitors see the same pins.
  let pins = [];
  const markers = {};
  let draft = null;
  let popupOpen = false;
  const JHDR = { 'Content-Type': 'application/json' };
  async function api(path, opts){
    const r = await fetch(path, opts);
    if (!r.ok) throw new Error('API error ' + r.status);
    return r.json();
  }
  async function loadPins(announce){
    try {
      pins = await api('/api/pins');
      renderPins();
      fitToDogs();
      if (announce) setStatus('Synced: ' + pins.length + ' shared sighting' + (pins.length===1?'':'s'), 'ok');
    } catch (e) {
      if (announce) setStatus('Server unreachable — shared pins not loaded', 'err');
    }
  }
  async function addPinApi(pin){ const r = await api('/api/pins', { method:'POST', headers:JHDR, body: JSON.stringify(pin) }); pin.id = r.id; pin.created = r.created; }
  async function savePinApi(pin){ await api('/api/pins/' + pin.id, { method:'PUT', headers:JHDR, body: JSON.stringify(pin) }); }
  async function removePinApi(id){ await api('/api/pins/' + id, { method:'DELETE' }); }
  function renderPins(){
    Object.values(markers).forEach(m=>map.removeLayer(m));
    for (const k in markers) delete markers[k];
    pins.forEach(addMarker);
    renderList();
  }

  function makeIcon(pin){
    const d = SIZES[pin.size] || 20;
    return L.divIcon({className:'', iconSize:[d,d], iconAnchor:[d/2,d/2],
      html:'<div class="nw-pin" style="width:'+d+'px;height:'+d+'px;background:'+pin.hex+'"></div>'});
  }
  function label(pin){ return [pin.size, pin.color, pin.sex].filter(Boolean).join(' \u00b7 '); }
  function formHTML(pin, isNew){
    const size=(pin&&pin.size)||'Medium';
    const color=(pin&&pin.color)||'Brown';
    const sex=(pin&&pin.sex)||'Unknown';
    const notes=(pin&&pin.notes)||'';
    const sw=COLORS.map(c=>'<span class="swatch'+(c.name===color?' active':'')+'" data-color="'+c.name+'" title="'+c.name+'" style="background:'+c.hex+'"></span>').join('');
    const sBtn=v=>'<button class="seg'+(size===v?' active':'')+'" data-size="'+v+'">'+v+'</button>';
    const xBtn=v=>'<button class="seg'+(sex===v?' active':'')+'" data-sex="'+v+'">'+v+'</button>';
    return '<div class="dogform">'
      +'<div class="formrow"><label>Size</label><div class="seggroup" data-group="size">'+sBtn('Small')+sBtn('Medium')+sBtn('Large')+'</div></div>'
      +'<div class="formrow"><label>Color</label><div class="swgroup">'+sw+'</div></div>'
      +'<div class="formrow"><label>Sex</label><div class="seggroup" data-group="sex">'+xBtn('Male')+xBtn('Female')+xBtn('Unknown')+'</div></div>'
      +'<div class="formrow"><label>Notes</label><textarea class="notes" placeholder="behavior, owner, etc.">'+notes.replace(/</g,'&lt;')+'</textarea></div>'
      +'<div class="formbtns">'
      +(isNew?'':'<button class="fb del">Delete</button>')
      +'<button class="fb cancel">Cancel</button><button class="fb save">Save</button></div>'
      +(isNew?'':'<div class="delconfirm" hidden><span>Delete this sighting?</span><button class="fb del yes">Yes, delete</button><button class="fb no">No</button></div>')
      +'</div>';
  }

  function attachForm(marker, pin, isNew){
    const holder=document.createElement('div');
    holder.innerHTML=formHTML(pin,isNew);
    const form=holder.firstElementChild;
    let size=(pin&&pin.size)||'Medium';
    let color=(pin&&pin.color)||'Brown';
    let sex=(pin&&pin.sex)||'Unknown';

    const grp=name=>form.querySelectorAll('[data-group="'+name+'"] .seg');
    grp('size').forEach(btn=>btn.addEventListener('click',ev=>{ev.stopPropagation();grp('size').forEach(b=>b.classList.remove('active'));btn.classList.add('active');size=btn.dataset.size;}));
    grp('sex').forEach(btn=>btn.addEventListener('click',ev=>{ev.stopPropagation();grp('sex').forEach(b=>b.classList.remove('active'));btn.classList.add('active');sex=btn.dataset.sex;}));
    form.querySelectorAll('.swgroup .swatch').forEach(s=>s.addEventListener('click',ev=>{ev.stopPropagation();form.querySelectorAll('.swgroup .swatch').forEach(x=>x.classList.remove('active'));s.classList.add('active');color=s.dataset.color;}));

    const notesEl=form.querySelector('.notes');
    form.querySelector('.save').addEventListener('click',async ev=>{
      ev.stopPropagation();
      const hex=(COLORS.find(c=>c.name===color)||COLORS[0]).hex;
      const notes=notesEl.value.trim();
      try {
        if (isNew){
          const p={ lat:marker.getLatLng().lat, lng:marker.getLatLng().lng, size, color, hex, sex, notes };
          draft=null;
          map.removeLayer(marker);
          await addPinApi(p);
        } else {
          pin.size=size;pin.color=color;pin.hex=hex;pin.sex=sex;pin.notes=notes;
          await savePinApi(pin);
        }
        map.closePopup();
        await loadPins(true);
      } catch (e) {
        setStatus('Could not save pin: ' + e.message, 'err');
      }
    });
    form.querySelector('.cancel').addEventListener('click',ev=>{
      ev.stopPropagation();
      map.closePopup();
      if (isNew){ map.removeLayer(marker); draft=null; }
    });

    // Red Delete button + in-popup confirmation (existing pins only)
    const delBtn=form.querySelector('.fb.del');
    const delRow=form.querySelector('.delconfirm');
    if (delBtn && delRow){
      delBtn.addEventListener('click',ev=>{
        ev.stopPropagation();
        form.querySelector('.formbtns').style.display='none';
        delRow.hidden=false;
      });
      delRow.querySelector('.no').addEventListener('click',ev=>{
        ev.stopPropagation();
        delRow.hidden=true;
        form.querySelector('.formbtns').style.display='';
      });
      delRow.querySelector('.yes').addEventListener('click',async ev=>{
        ev.stopPropagation();
        try{
          await removePinApi(pin.id);
          map.closePopup();
          map.removeLayer(marker);
          await loadPins(true);
        }catch(e){ setStatus('Could not delete pin','err'); }
      });
    }

    marker.bindPopup(form, { maxWidth:330, autoPan:true, closeButton:true });
    marker.openPopup();
  }
  function addMarker(pin){
    const m=L.marker([pin.lat,pin.lng],{icon:makeIcon(pin),draggable:true,opacity:.95});
    m.addTo(map);
    m.on('click',()=>attachForm(m,pin,false));
    m.on('dragend',async()=>{ pin.lat=m.getLatLng().lat; pin.lng=m.getLatLng().lng; try{ await savePinApi(pin); }catch(e){ setStatus('Could not move pin','err'); } });
    const tip=label(pin)+(pin.notes?'<div class="pinnotes">'+pin.notes.replace(/</g,'&lt;')+'</div>':'');
    m.bindTooltip(tip,{direction:'top',offset:[0,-10]});
    markers[pin.id]=m;
    return m;
  }

  map.on('click',e=>{
    if (draft){ map.removeLayer(draft); draft=null; }
    const m=L.marker([e.latlng.lat,e.latlng.lng],{icon:makeIcon({size:'Medium',color:'Brown',hex:'#6b4423'}),draggable:true,opacity:.95});
    m.addTo(map);
    draft=m;
    attachForm(m,null,true);
  });

  function renderList(){
    const ul=document.getElementById('pins'); ul.innerHTML='';
    document.getElementById('countNum').textContent=String(pins.length);
    pins.slice().reverse().forEach(pin=>{
      const li=document.createElement('li');
      const dot=document.createElement('span'); dot.className='dot'; dot.style.background=pin.hex;
      const meta=document.createElement('div'); meta.className='pinmeta';
      const lab=document.createElement('div'); lab.className='pinlabel'; lab.textContent=label(pin);
      meta.appendChild(lab);
      if (pin.notes){ const nn=document.createElement('div'); nn.className='pinnote'; nn.textContent=pin.notes; meta.appendChild(nn); }
      const del=document.createElement('button'); del.className='del'; del.textContent='\u00d7'; del.title='Remove';
      del.addEventListener('click',async()=>{ try{ await removePinApi(pin.id); await loadPins(true); }catch(e){ setStatus('Could not delete pin','err'); } });
      li.title='Focus map on this dog';
      li.addEventListener('click',(ev)=>{
        if (ev.target.closest('.del')) return;           // let the remove button do its own thing
        const m=markers[pin.id];
        if (!m) return;
        const open=()=>attachForm(m,pin,false);
        if (map.getZoom()>=15 && map.getBounds().contains([pin.lat,pin.lng])){ open(); return; }  // already framed
        map.closePopup();
        map.once('moveend',open);
        map.flyTo([pin.lat,pin.lng],16,{duration:.6,easeLinearity:.25});
      });
      li.append(dot,meta,del); ul.appendChild(li);
    });
  }

  // --- Geolocation: center on the user's phone; fall back to Bucyrus if denied/unavailable ---
  // Two-pass strategy for mobile (e.g. Samsung/Chrome): first try high-accuracy GPS with a
  // generous timeout (a cold GPS fix can take >10 s). If that fails with "unavailable" or
  // "timeout", retry with network location (WiFi/cell), which usually works even when GPS
  // hardware is slow or denied precision.
  const BUCYRUS=[40.808,-82.975];
  let userCircle=null, userDot=null;
  const statusEl=document.getElementById('status');
  function setStatus(msg, cls){ statusEl.textContent=msg; statusEl.className='status'+(cls?' '+cls:''); }
  function placeUser(pos){
    const ll=[pos.coords.latitude,pos.coords.longitude];
    map.setView(ll,16);
    if(userCircle){ map.removeLayer(userCircle); userCircle=null; }
    if(userDot){ map.removeLayer(userDot); userDot=null; }
    if(pos.coords.accuracy){ userCircle=L.circle(ll,{radius:pos.coords.accuracy,color:'#3b82f6',weight:1,fillColor:'#3b82f6',fillOpacity:.12}).addTo(map); }
    userDot=L.marker(ll,{icon:L.divIcon({className:'',iconSize:[16,16],iconAnchor:[8,8],html:'<div style="width:16px;height:16px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 0 4px rgba(59,130,246,.25)"></div>'})}).addTo(map).bindTooltip('Your location',{direction:'top',offset:[0,-10]});
    setStatus('Centered on you (' + (pos.coords.accuracy ? '\u00b1' + Math.round(pos.coords.accuracy) + ' m' : 'approximate') + ')','ok');
  }
  function locate(){
    if(!('geolocation' in navigator)){ setStatus('Location not supported, defaulting to Bucyrus, OH','err'); return; }
    setStatus('Requesting location (allow location access if prompted)...');
    askPosition(true);
  }
  function askPosition(highAccuracy){
    navigator.geolocation.getCurrentPosition(placeUser,err=>{
      if (highAccuracy && err && (err.code===2 || err.code===3)) {
        setStatus('GPS unavailable, trying network location...');
        askPosition(false);
        return;
      }
      map.setView(BUCYRUS,15);
      let msg;
      if (err && err.code===1)      msg='permission denied - allow Location in your browser settings, then tap "Use my location" again';
      else if (err && err.code===2) msg='unavailable on this device - turn on Location in your phone Settings, then tap "Use my location" again';
      else                          msg='request timed out - try again outside or near a window';
      setStatus('GPS: ' + msg + ' - showing Bucyrus, OH','err');
    },{enableHighAccuracy:highAccuracy,timeout:highAccuracy?20000:8000,maximumAge:60000});
  }
  document.getElementById('locate').addEventListener('click',locate);
  if (!embedded) loadPins(true).then(()=>{ if (!fitted) locate(); });

  // --- City search (Nominatim / OpenStreetMap geocoding, no API key) ---
  let searchMarker=null;
  async function searchCity(){
    const el=document.getElementById('city');
    const q=el.value.trim();
    if(!q) return;
    setStatus('Searching "'+q+'"…');
    let hit=null;
    // 1) Photon (Komoot): OSM-based geocoder served by a host that does NOT impose OpenStreetMap's policy blocks.
    try{
      const pr=await fetch('https://photon.komoot.io/api/?limit=1&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});
      if(pr.ok){
        const pd=await pr.json();
        const f=pd&&pd.features&&pd.features[0];
        if(f&&f.geometry&&f.geometry.coordinates){
          const p=f.properties||{};
          hit={ lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0], boundingbox:null, name:p.name||q, display_name:[p.name,p.neighbourhood,p.city,p.state,p.country].filter(Boolean).join(', ')||q };
        }
      }
    }catch(e){}
    // 2) Nominatim (fallback only)
    if(!hit){
      try{
        const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});
        if(r.ok){
          const d=await r.json();
          const n=d&&d[0];
          if(n){ hit={ lat:parseFloat(n.lat), lon:parseFloat(n.lon), boundingbox:(n.boundingbox?n.boundingbox.map(parseFloat):null), name:n.name||q, display_name:n.display_name||q }; }
        }
      }catch(e){}
    }
    if(!hit){ setStatus('No match for "'+q+'" (or search blocked), staying put','err'); return; }
    const ll=[hit.lat,hit.lon];
    if(hit.boundingbox){
      const b=hit.boundingbox;
      map.fitBounds([[b[0],b[2]],[b[1],b[3]]],{maxZoom:16,paddingTopLeft:L.point(40,60),paddingBottomRight:L.point(250,40)});
    }else{
      map.setView(ll,14);
    }
    if(refMarker){ map.removeLayer(refMarker); refMarker=null; }
    if(searchMarker){ map.removeLayer(searchMarker); }
    searchMarker=L.marker(ll,{icon:L.divIcon({className:'',iconSize:[14,14],iconAnchor:[7,7],html:'<div style="width:14px;height:14px;border-radius:50%;background:#f5a623;border:2px solid #fff;box-shadow:0 0 0 4px rgba(245,166,35,.3)"></div>'})}).addTo(map).bindTooltip(hit.display_name,{direction:'top',offset:[0,-10]});
    setStatus('Map: '+hit.name);
  }
  document.getElementById('searchBtn').addEventListener('click',searchCity);
  document.getElementById('city').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); searchCity(); }});

  // --- shared-pins startup: load from the server, auto-refresh, track popup state ---
  map.on('popupopen',()=>{ popupOpen=true; });
  map.on('popupclose',()=>{ popupOpen=false; });
  const refreshBtn=document.getElementById('refresh');
  if (refreshBtn) refreshBtn.addEventListener('click',()=>loadPins(true));
  if (embedded) loadPins(true);                            // initial shared load (full-screen loads above)
  setInterval(()=>{ if(!popupOpen) loadPins(false); }, 15000);  // pick up other users' pins
  // --- Mobile hamburger: controls become a dropdown under the black header bar ---
  const menuBtn=document.getElementById('menuBtn');
  const controlsEl=document.querySelector('.controls');
  if (menuBtn && controlsEl) {
    menuBtn.addEventListener('click',e=>{
      e.stopPropagation();
      const open=controlsEl.classList.toggle('open');
      if (open) {
        controlsEl.style.top=(document.querySelector('header').offsetHeight+1)+'px';
        menuBtn.setAttribute('aria-expanded','true');
      } else {
        menuBtn.setAttribute('aria-expanded','false');
      }
    });
    document.addEventListener('click',e=>{
      if (controlsEl.classList.contains('open') && !controlsEl.contains(e.target) && !menuBtn.contains(e.target)) {
        controlsEl.classList.remove('open');
        menuBtn.setAttribute('aria-expanded','false');
      }
    });
  }
  </script>
</body>
